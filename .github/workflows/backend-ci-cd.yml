name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: ["main", "master"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. Quality & Type Checking
  # ========================================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Type Checking
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  # ========================================================
  # 2. Build & Test with Test Database
  # ========================================================
  build-and-test:
    name: Build & Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: petnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/petnest_test?schema=public"
      JWT_SECRET: "ci_test_jwt_secret_key_123456789"
      JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_key_123456789"
      PORT: 5000

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: Run Unit Tests
        run: npm run test -- --passWithNoTests

      - name: Build Production Bundle
        run: npm run build

  # ========================================================
  # 3. Docker Image Build & Validation
  # ========================================================
  docker-build:
    name: Docker Image Build
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: petnest-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
